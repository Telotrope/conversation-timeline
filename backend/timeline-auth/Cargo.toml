[package]
name = "timeline-auth"
version = "0.1.0"
edition.workspace = true

[dependencies]
timeline-core = { path = "../timeline-core" }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
base64 = "0.22"
