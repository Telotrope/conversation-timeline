[package]
name = "timeline-storage"
version = "0.1.0"
edition.workspace = true

[dependencies]
timeline-core = { path = "../timeline-core" }
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
aws-sdk-s3 = "1"
aws-sdk-dynamodb = "1"
aws-smithy-types = "1"
uuid = "1"
serde_json = "1"
# Reporting failed AWS calls to the API's per-request log (src/aws_failure.rs). MIT.
tracing = "0.1"

[dev-dependencies]
aws-config = { version = "1", features = ["credentials-login"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "http1"] }
reqwest = { version = "0.13.5", default-features = false }
s3s = "0.17"
s3s-fs = "0.17"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "time"] }
uuid = { version = "1", features = ["v4"] }
