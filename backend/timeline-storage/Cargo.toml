[package]
name = "timeline-storage"
version = "0.1.0"
edition.workspace = true

[dependencies]
timeline-core = { path = "../timeline-core" }
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
aws-sdk-s3 = "1"
aws-sdk-dynamodb = "1"
aws-smithy-types = "1"
uuid = "1"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
