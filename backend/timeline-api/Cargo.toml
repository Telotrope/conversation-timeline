[package]
name = "timeline-api"
version = "0.1.0"
edition.workspace = true

[dependencies]
timeline-core = { path = "../timeline-core" }
timeline-storage = { path = "../timeline-storage" }
timeline-auth = { path = "../timeline-auth" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
lambda_http = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "9"
tower-http = { version = "0.6", features = ["cors"] }
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
aws-config = "1"
aws-sdk-s3 = "1"
aws-sdk-dynamodb = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = "0.1"
s3s = "0.17"
s3s-fs = "0.17"
tempfile = "3.27.0"
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "http1"] }
