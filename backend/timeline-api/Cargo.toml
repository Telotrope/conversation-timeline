[package]
name = "timeline-api"
version = "0.1.0"
edition.workspace = true

[dependencies]
timeline-core = { path = "../timeline-core" }
timeline-storage = { path = "../timeline-storage" }
timeline-auth = { path = "../timeline-auth" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
lambda_http = "0.15"
lambda_runtime = "0.14"
aws_lambda_events = { version = "0.16", default-features = false, features = ["s3"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "9"
tower-http = { version = "0.6", features = ["cors"] }
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
aws-config = "1"
aws-sdk-s3 = "1"
aws-sdk-dynamodb = "1"
# Counting each request's calls to AWS from the SDK's own operation spans
# (docs/plans/2026-10-02-activity-instrumentation.md §3). Both MIT.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
# Decompressing gzip uploads (plan 2026-10-06-load-only-what-the-page-shows.md §7b).
# MIT OR Apache-2.0; its zlib-rs backend is under the Zlib licence.
flate2 = "1"
# Writing several conversations at once during processing. MIT OR Apache-2.0.
futures = "0.3"
# The message walk's visitor (src/message_query.rs). MIT OR Apache-2.0.
async-trait = "0.1"
chrono-tz = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = "0.1"
s3s = "0.17"
s3s-fs = "0.17"
tempfile = "3.27.0"
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "http1"] }
flate2 = "1"
