[package]
name = "timeline-api"
version = "0.1.0"
edition.workspace = true

[dependencies]
timeline-core = { path = "../timeline-core" }
timeline-storage = { path = "../timeline-storage" }
timeline-auth = { path = "../timeline-auth" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
lambda_http = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "9"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = "0.1"
