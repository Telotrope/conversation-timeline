[package]
name = "timeline-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
regex = "1"
uuid = { version = "1", features = ["serde"] }
async-trait = "0.1"
chrono-tz = "0.10"

[dev-dependencies]
proptest = "1"
insta = "1"
