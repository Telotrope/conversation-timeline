# AWS SAM template for V2 of the migration plan
# (docs/plans/2026-09-09-rust-aws-backend-migration.md). Declares the
# resources listed in that plan's V2 section: S3, three DynamoDB tables,
# one Lambda (running the whole axum app from timeline-api -- lambda_http
# routes internally, so one function behind one API Gateway catch-all
# integration, not one function per route), API Gateway, and a Cognito user
# pool.
#
# Three Lambdas share one build (`cargo lambda build --release --arm64 -p
# timeline-api`): the API, the upload-processing function S3 starts when a
# raw upload lands (migration plan §V2e), and the function that marks an
# upload failed once processing has failed every attempt (plan
# 2026-10-02-upload-processing-failures.md §2).
#
# This template has never been deployed. The plan's §V2e lists what only a
# first deployment can check; `scripts/check-template.sh` runs
# `sam validate --lint` on it beforehand.

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Conversation timeline backend (V2) -- S3 + DynamoDB storage, Cognito auth,
  one Lambda running the full axum app behind API Gateway.

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: Deployment stage name (dev/staging/prod), used to namespace resources.
  FrontendUrl:
    Type: String
    Default: http://localhost:8000/timeline.html
    AllowedPattern: '^https?://[^/]+(/[^?#]*)?/timeline\.html$'
    ConstraintDescription: >
      must be the full address timeline.html is opened at, starting with
      http:// or https:// and ending in /timeline.html, with no ?... or #...
    Description: >
      The full address you open timeline.html at, without ?deploy=... (for
      example https://dev.example.ts.net/proxy/8000/timeline.html behind a
      forwarding proxy). Cognito returns you to exactly this address, and
      its origin (scheme, host and port) is the only one CORS allows on the
      API and the bucket (migration plan §V2e, E10). Cognito accepts plain
      http only for localhost.
  LogS3Events:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: >
      "on" makes the processing function log each S3 notification it
      receives (uploader's IP address removed), to capture one real
      notification as a test sample (migration plan §V2e, E9). Leave off.
  FailProcessing:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: >
      "on" makes every upload-processing attempt fail on purpose, after
      counting the attempt, so the retries and the final "failed" can be
      watched on the page (plan 2026-10-02-upload-processing-failures.md
      §2b). For that test only; leave off.
  RecordActivity:
    Type: String
    Default: "on"
    AllowedValues: ["off", "on"]
    Description: >
      "on" makes the page record what the user does and send it to
      POST /activity (docs/plans/2026-10-02-activity-instrumentation.md §4).
      Takes effect only on the dev stage; every other stage is off.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]
    Description: >
      How many days CloudWatch keeps every log group this stack owns before
      deleting older records itself (the plan's §6; the user chose 7).
  HostPage:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: >
      "on" serves the page from this stack: an S3 bucket behind CloudFront,
      filled by scripts/publish-page.sh (docs/plans/2026-10-02-page-hosting.md
      §1). Cognito and CORS then accept the hosted page's address instead of
      FrontendUrl.
  PageDomain:
    Type: String
    Default: ""
    AllowedPattern: '^$|^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$'
    ConstraintDescription: must be empty or a lowercase domain name, e.g. howangryami.telotrope.ai
    Description: >
      With HostPage on: the domain the page is served at, e.g.
      howangryami.telotrope.ai. Empty uses CloudFront's own address. Needs
      PageCertificateArn. Its DNS record is added by hand (the hosting
      plan's §1a).
  PageCertificateArn:
    Type: String
    Default: ""
    AllowedPattern: '^$|^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$'
    ConstraintDescription: must be empty or a Certificate Manager certificate's ARN in us-east-1
    Description: >
      With PageDomain: an issued certificate for it, made once by hand in
      Certificate Manager in us-east-1 (the only region CloudFront accepts),
      so redeploys and new stacks never make another (the hosting plan's C14).
  AlsoAllowLocalPage:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: >
      With HostPage on: "on" also accepts FrontendUrl, so a hosted dev stack
      still works with a page served from your machine. Leave off for
      production (the hosting plan's C6).

Rules:
  # A domain needs hosting and a certificate, and a certificate needs a
  # domain (the hosting plan's §1a). PageCertificateArn's pattern keeps the
  # certificate in us-east-1.
  PageDomainNeedsHostingAndCertificate:
    RuleCondition: !Not [!Equals [!Ref PageDomain, ""]]
    Assertions:
      - Assert: !Equals [!Ref HostPage, "on"]
        AssertDescription: PageDomain is used only with HostPage on.
      - Assert: !Not [!Equals [!Ref PageCertificateArn, ""]]
        AssertDescription: PageDomain needs PageCertificateArn, a certificate for it.
  PageCertificateNeedsDomain:
    RuleCondition: !Not [!Equals [!Ref PageCertificateArn, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref PageDomain, ""]]
        AssertDescription: PageCertificateArn is used only with PageDomain.

Conditions:
  # The dev stage also allows username-and-password sign-in through the
  # API, for scripts/aws-dev-token.sh (migration plan §V2e, E7; C27).
  IsDev: !Equals [!Ref Stage, dev]
  # Recording is for the development stack only (the plan's §9).
  RecordsActivity: !And [!Condition IsDev, !Equals [!Ref RecordActivity, "on"]]
  # The page hosting plan's §1.
  HostingPage: !Equals [!Ref HostPage, "on"]
  # The rules make PageDomain and PageCertificateArn set together; naming
  # both here lets cfn-lint see the certificate is never empty when used.
  HasPageDomain: !And
    - !Condition HostingPage
    - !Not [!Equals [!Ref PageDomain, ""]]
    - !Not [!Equals [!Ref PageCertificateArn, ""]]
  AllowsLocalPage: !And [!Condition HostingPage, !Equals [!Ref AlsoAllowLocalPage, "on"]]

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Architectures: [arm64]
    Runtime: provided.al2023

Resources:
  # --- Logs ------------------------------------------------------------------
  # One group per function plus API Gateway's request log, each kept for
  # LogRetentionDays (docs/plans/2026-10-02-activity-instrumentation.md §6).
  # New names: the groups Lambda created on first use keep the 2026-10-02
  # deployment checks' records and are left alone.

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/timeline/${Stage}/api"
      RetentionInDays: !Ref LogRetentionDays
  ActivityLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/timeline/${Stage}/activity"
      RetentionInDays: !Ref LogRetentionDays
  ProcessUploadLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/timeline/${Stage}/process-upload"
      RetentionInDays: !Ref LogRetentionDays
  RecordFailedUploadLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/timeline/${Stage}/record-failed-upload"
      RetentionInDays: !Ref LogRetentionDays
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/timeline/${Stage}/api-access"
      RetentionInDays: !Ref LogRetentionDays

  # --- Storage -------------------------------------------------------------

  RawUploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "timeline-uploads-${Stage}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          # The page PUTs uploads to, and GETs exports from, presigned
          # addresses directly (migration plan §1.6), from the page's origin
          # (E10). The same list as the API's CorsConfiguration and the
          # same addresses as UserPoolClient's CallbackURLs (the hosting
          # plan's §1 table); CloudFormation has no variables, so the three
          # copies must be changed together.
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: !If
              - HostingPage
              - !If
                - AllowsLocalPage
                - - !Sub ["https://${Host}", {Host: !If [HasPageDomain, !Ref PageDomain, !GetAtt PageDistribution.DomainName]}]
                  - !Join ["", [!Select [0, !Split ["/", !Ref FrontendUrl]], "//", !Select [2, !Split ["/", !Ref FrontendUrl]]]]
                - - !Sub ["https://${Host}", {Host: !If [HasPageDomain, !Ref PageDomain, !GetAtt PageDistribution.DomainName]}]
              - - !Join ["", [!Select [0, !Split ["/", !Ref FrontendUrl]], "//", !Select [2, !Split ["/", !Ref FrontendUrl]]]]
            AllowedHeaders: [content-type]

  ConversationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "timeline-conversations-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  MessageFlagsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "timeline-message-flags-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "timeline-users-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  # --- Auth ------------------------------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "timeline-users-${Stage}"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true

  # Cognito's own login pages, at
  # https://timeline-<stage>-<account>.auth.<region>.amazoncognito.com
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "timeline-${Stage}-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

  # The page signs in through the login pages with the authorization-code
  # flow and PKCE (frontend/infra/cognito-login.js; plan §V2e, E5).
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "timeline-web-${Stage}"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      # The hosted page is at `/` only (the hosting plan's §1 table and C12):
      # the page returns to the exact path it was opened at.
      CallbackURLs: !If
        - HostingPage
        - !If
          - AllowsLocalPage
          - - !Sub ["https://${Host}/", {Host: !If [HasPageDomain, !Ref PageDomain, !GetAtt PageDistribution.DomainName]}]
            - !Ref FrontendUrl
          - - !Sub ["https://${Host}/", {Host: !If [HasPageDomain, !Ref PageDomain, !GetAtt PageDistribution.DomainName]}]
        - - !Ref FrontendUrl
      LogoutURLs: !If
        - HostingPage
        - !If
          - AllowsLocalPage
          - - !Sub ["https://${Host}/", {Host: !If [HasPageDomain, !Ref PageDomain, !GetAtt PageDistribution.DomainName]}]
            - !Ref FrontendUrl
          - - !Sub ["https://${Host}/", {Host: !If [HasPageDomain, !Ref PageDomain, !GetAtt PageDistribution.DomainName]}]
        - - !Ref FrontendUrl
      ExplicitAuthFlows: !If
        - IsDev
        - [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_PASSWORD_AUTH]
        - [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 1
      IdTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours

  # --- Secrets -----------------------------------------------------------

  # Signs the flag handles GET /export issues and PATCH .../flags checks (see
  # backend/timeline-api/src/flag_handles.rs and the migration plan's §V2c).
  # Every Lambda instance must use the same key, so it can't be generated at
  # startup. 64 letters and digits, comfortably over the 32-byte minimum the
  # Lambda enforces. Rotating it invalidates every handle already issued
  # until the page reloads (plan C19).
  FlagHandleKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "timeline-flag-handle-key-${Stage}"
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # --- Compute / API -----------------------------------------------------

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "timeline-api-${Stage}"
      # Built via `cargo lambda build --release --arm64` from backend/timeline-api;
      # this path is where that build's output bootstrap binary/zip is expected.
      CodeUri: ../backend/target/lambda/timeline-api/
      Handler: bootstrap
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          TIMELINE_UPLOADS_BUCKET: !Sub "timeline-uploads-${Stage}-${AWS::AccountId}"
          TIMELINE_CONVERSATIONS_TABLE: !Ref ConversationsTable
          TIMELINE_MESSAGE_FLAGS_TABLE: !Ref MessageFlagsTable
          TIMELINE_USERS_TABLE: !Ref UsersTable
          TIMELINE_COGNITO_USER_POOL_ID: !Ref UserPool
          TIMELINE_COGNITO_CLIENT_ID: !Ref UserPoolClient
          # Resolved at deploy time; the Lambda refuses to start without it.
          TIMELINE_FLAG_HANDLE_KEY: !Sub "{{resolve:secretsmanager:${FlagHandleKeySecret}}}"
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub "timeline-uploads-${Stage}-${AWS::AccountId}"
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessageFlagsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      # One route per method rather than ANY, so no route matches the
      # browser's OPTIONS check: with CORS configured, API Gateway then
      # answers it itself, before any login is required (plan §V2e, E6;
      # read in AWS's documentation, unverified until deployment check D2).
      Events:
        GetRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: GET
        PostRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: POST
        PatchRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: PATCH

  # Started by S3 when a raw upload lands; runs `src/bin/process_upload.rs`.
  # Its permissions and settings name the bucket by its fixed pattern, not
  # `!Ref RawUploadsBucket`: AWS's SAM documentation warns that a function
  # triggered by a bucket whose permissions also `!Ref` that bucket makes a
  # circular dependency the deployment refuses. The API function does the
  # same, for consistency.
  #
  # Memory and time limit from scripts/measure-processing.sh (plan §V2e, E2):
  # a 62.8 MB synthetic export peaked at 188 MB and took under a second on
  # the development machine. Twice the memory, rounded up; five minutes,
  # far above three times the time. The real figures are deployment check D5.
  ProcessUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "timeline-process-upload-${Stage}"
      CodeUri: ../backend/target/lambda/process_upload/
      Handler: bootstrap
      LoggingConfig:
        LogGroup: !Ref ProcessUploadLogGroup
      MemorySize: 512
      Timeout: 300
      Environment:
        Variables:
          TIMELINE_UPLOADS_BUCKET: !Sub "timeline-uploads-${Stage}-${AWS::AccountId}"
          TIMELINE_CONVERSATIONS_TABLE: !Ref ConversationsTable
          TIMELINE_MESSAGE_FLAGS_TABLE: !Ref MessageFlagsTable
          TIMELINE_LOG_S3_EVENTS: !Ref LogS3Events
          TIMELINE_FAIL_PROCESSING: !Ref FailProcessing
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "timeline-uploads-${Stage}-${AWS::AccountId}"
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessageFlagsTable
        - LambdaInvokePolicy:
            FunctionName: !Ref RecordFailedUploadFunction
      # The first attempt plus 2 retries: 3 in all, the number the page
      # shows (MAX_PROCESSING_ATTEMPTS in s3_trigger.rs;
      # tests/template_processing_retries.rs checks they agree). When the
      # last one fails, for any reason, AWS hands the failure to
      # RecordFailedUploadFunction, which marks the upload failed (plan
      # 2026-10-02-upload-processing-failures.md §2).
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: Lambda
            Destination: !GetAtt RecordFailedUploadFunction.Arn
      Events:
        RawUploadCreated:
          Type: S3
          Properties:
            Bucket: !Ref RawUploadsBucket
            Events: s3:ObjectCreated:*
            # Only raw uploads; exports the API writes under export/ must
            # not start processing.
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/
                  - Name: suffix
                    Value: .json

  # Marks an upload failed once the processing function has failed every
  # attempt (its EventInvokeConfig above). Writes only the conversations
  # table. Built by the same `cargo lambda build -p timeline-api`.
  RecordFailedUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "timeline-record-failed-upload-${Stage}"
      CodeUri: ../backend/target/lambda/record_failed_upload/
      Handler: bootstrap
      LoggingConfig:
        LogGroup: !Ref RecordFailedUploadLogGroup
      MemorySize: 128
      Environment:
        Variables:
          TIMELINE_CONVERSATIONS_TABLE: !Ref ConversationsTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref ConversationsTable

  # Answers POST /activity, the page's record of what the user did; runs
  # `src/bin/record_activity.rs`. Its own function so a report never
  # occupies an API copy one of the user's requests then waits for (the
  # plan's §5). API Gateway sends this exact route here, ahead of the API's
  # catch-all POST /{proxy+}. Needs only the Cognito settings, no storage.
  ActivityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "timeline-activity-${Stage}"
      CodeUri: ../backend/target/lambda/record_activity/
      Handler: bootstrap
      MemorySize: 128
      LoggingConfig:
        LogGroup: !Ref ActivityLogGroup
      Environment:
        Variables:
          TIMELINE_COGNITO_USER_POOL_ID: !Ref UserPool
          TIMELINE_COGNITO_CLIENT_ID: !Ref UserPoolClient
      Events:
        PostActivity:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /activity
            Method: POST

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # `$default` adds nothing to the API's address. A named stage would
      # reach the Lambda as `/<stage>/conversations`, which lambda_http
      # passes on unchanged and the router doesn't know (migration plan
      # §V2e, E1; tests/lambda_events.rs). `Stage` still names the
      # resources.
      StageName: "$default"
      # One JSON line per request, including ones refused before any of our
      # code runs (401s, CORS checks): the plan's §2. No IP address or
      # browser description.
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","path":"$context.path","status":"$context.status","responseLatency":"$context.responseLatency","integrationLatency":"$context.integrationLatency","authorizerError":"$context.authorizer.error","errorMessage":"$context.error.message"}'
      # API Gateway refuses to import a definition it has warnings about,
      # instead of quietly keeping its old settings: on 2026-10-02 a CORS
      # block it couldn't use was ignored (docs/analysis/
      # 2026-10-02-page-hosting-deployment.md).
      FailOnWarnings: true
      # The page's origin (E10): the same list as the bucket's CorsRules.
      # The whole block is chosen by condition, three full copies, because
      # SAM takes a conditional AllowOrigins to be the entire CORS block and
      # drops the other settings (samtranslator open_api.py, add_cors).
      # x-timeline-session: the page's session id (the activity plan's §1).
      # ExposeHeaders: so the page can read API Gateway's id for each of its
      # requests and the timeline can match them (the activity plan's §5).
      CorsConfiguration: !If
        - HostingPage
        - !If
          - AllowsLocalPage
          - AllowOrigins:
              - !Sub ["https://${Host}", {Host: !If [HasPageDomain, !Ref PageDomain, !GetAtt PageDistribution.DomainName]}]
              - !Join ["", [!Select [0, !Split ["/", !Ref FrontendUrl]], "//", !Select [2, !Split ["/", !Ref FrontendUrl]]]]
            AllowHeaders: [authorization, content-type, x-timeline-session]
            AllowMethods: [GET, POST, PATCH]
            ExposeHeaders: [apigw-requestid]
            MaxAge: 600
          - AllowOrigins:
              - !Sub ["https://${Host}", {Host: !If [HasPageDomain, !Ref PageDomain, !GetAtt PageDistribution.DomainName]}]
            AllowHeaders: [authorization, content-type, x-timeline-session]
            AllowMethods: [GET, POST, PATCH]
            ExposeHeaders: [apigw-requestid]
            MaxAge: 600
        - AllowOrigins:
            - !Join ["", [!Select [0, !Split ["/", !Ref FrontendUrl]], "//", !Select [2, !Split ["/", !Ref FrontendUrl]]]]
          AllowHeaders: [authorization, content-type, x-timeline-session]
          AllowMethods: [GET, POST, PATCH]
          ExposeHeaders: [apigw-requestid]
          MaxAge: 600
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
            IdentitySource: "$request.header.Authorization"
        DefaultAuthorizer: CognitoAuthorizer

  # --- Hosted page (docs/plans/2026-10-02-page-hosting.md §1) ---------------

  # Private: only this stack's CloudFront distribution can read it. Named by
  # CloudFormation; scripts/publish-page.sh reads the PageBucketName output.
  PageBucket:
    Type: AWS::S3::Bucket
    Condition: HostingPage
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  PageOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: HostingPage
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "timeline-page-${Stage}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  PageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HostingPage
    Properties:
      Bucket: !Ref PageBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${PageBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${PageDistribution}"

  # Files stay at the edge for a day; scripts/publish-page.sh clears them on
  # every publish. Browsers are told to recheck each load by the files' own
  # Cache-Control: no-cache, which CloudFront passes on (the hosting plan's
  # C4, C7; deployment check H5). The query string (?code=..., ?deploy=...)
  # is left out of the cache key: every address serves the same files.
  PageCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Condition: HostingPage
    Properties:
      CachePolicyConfig:
        Name: !Sub "timeline-page-${Stage}"
        MinTTL: 86400
        DefaultTTL: 86400
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  PageDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HostingPage
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "timeline page (${Stage})"
        # scripts/publish-page.sh uploads timeline.html as index.html.
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Aliases: !If [HasPageDomain, [!Ref PageDomain], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasPageDomain
          - AcmCertificateArn: !Ref PageCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: page-bucket
            DomainName: !GetAtt PageBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt PageOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: page-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref PageCachePolicy
          # AWS's managed SecurityHeadersPolicy: HSTS, nosniff, frame and
          # referrer headers. No Content-Security-Policy yet (the hosting
          # plan's C5).
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

Outputs:
  ApiUrl:
    Description: Base URL of the deployed HTTP API.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Description: Base address of Cognito's login pages for this pool.
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  RawUploadsBucketName:
    Value: !Ref RawUploadsBucket
  RecordActivity:
    Description: Whether the page records activity; read by scripts/write-deploy-config.sh.
    Value: !If [RecordsActivity, "on", "off"]
  PageUrl:
    Condition: HostingPage
    Description: The hosted page's address.
    Value: !Sub ["https://${Host}/", {Host: !If [HasPageDomain, !Ref PageDomain, !GetAtt PageDistribution.DomainName]}]
  PageBucketName:
    Condition: HostingPage
    Description: Where scripts/publish-page.sh uploads the page.
    Value: !Ref PageBucket
  PageDistributionId:
    Condition: HostingPage
    Description: The distribution scripts/publish-page.sh clears after uploading.
    Value: !Ref PageDistribution
  PageDnsTarget:
    Condition: HostingPage
    Description: With PageDomain set, the CNAME target for PageDomain at Porkbun.
    Value: !GetAtt PageDistribution.DomainName
