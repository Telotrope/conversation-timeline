# AWS SAM template for V2 of the migration plan
# (docs/plans/2026-09-09-rust-aws-backend-migration.md). Declares the
# resources listed in that plan's V2 section: S3, three DynamoDB tables,
# one Lambda (running the whole axum app from timeline-api -- lambda_http
# routes internally, so one function behind one API Gateway catch-all
# integration, not one function per route), API Gateway, and a Cognito user
# pool.
#
# Two Lambdas share one build (`cargo lambda build --release --arm64 -p
# timeline-api`): the API, and the upload-processing function S3 starts
# when a raw upload lands (migration plan §V2e).
#
# This template has never been deployed. The plan's §V2e lists what only a
# first deployment can check; `scripts/check-template.sh` runs
# `sam validate --lint` on it beforehand.

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Conversation timeline backend (V2) -- S3 + DynamoDB storage, Cognito auth,
  one Lambda running the full axum app behind API Gateway.

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: Deployment stage name (dev/staging/prod), used to namespace resources.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Architectures: [arm64]
    Runtime: provided.al2023

Resources:
  # --- Storage -------------------------------------------------------------

  RawUploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "timeline-uploads-${Stage}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          # Presigned PUT/GET URLs are used directly by the browser -- see
          # the migration plan section 1.6. Tighten AllowedOrigins to the
          # real frontend origin before this is ever deployed for real.
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]

  ConversationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "timeline-conversations-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  MessageFlagsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "timeline-message-flags-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "timeline-users-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  # --- Auth ------------------------------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "timeline-users-${Stage}"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "timeline-web-${Stage}"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours

  # --- Secrets -----------------------------------------------------------

  # Signs the flag handles GET /export issues and PATCH .../flags checks (see
  # backend/timeline-api/src/flag_handles.rs and the migration plan's §V2c).
  # Every Lambda instance must use the same key, so it can't be generated at
  # startup. 64 letters and digits, comfortably over the 32-byte minimum the
  # Lambda enforces. Rotating it invalidates every handle already issued
  # until the page reloads (plan C19).
  FlagHandleKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "timeline-flag-handle-key-${Stage}"
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # --- Compute / API -----------------------------------------------------

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "timeline-api-${Stage}"
      # Built via `cargo lambda build --release --arm64` from backend/timeline-api;
      # this path is where that build's output bootstrap binary/zip is expected.
      CodeUri: ../backend/target/lambda/timeline-api/
      Handler: bootstrap
      Environment:
        Variables:
          TIMELINE_UPLOADS_BUCKET: !Sub "timeline-uploads-${Stage}-${AWS::AccountId}"
          TIMELINE_CONVERSATIONS_TABLE: !Ref ConversationsTable
          TIMELINE_MESSAGE_FLAGS_TABLE: !Ref MessageFlagsTable
          TIMELINE_USERS_TABLE: !Ref UsersTable
          TIMELINE_COGNITO_USER_POOL_ID: !Ref UserPool
          TIMELINE_COGNITO_CLIENT_ID: !Ref UserPoolClient
          # Resolved at deploy time; the Lambda refuses to start without it.
          TIMELINE_FLAG_HANDLE_KEY: !Sub "{{resolve:secretsmanager:${FlagHandleKeySecret}}}"
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub "timeline-uploads-${Stage}-${AWS::AccountId}"
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessageFlagsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        AnyRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  # Started by S3 when a raw upload lands; runs `src/bin/process_upload.rs`.
  # Its permissions and settings name the bucket by its fixed pattern, not
  # `!Ref RawUploadsBucket`: AWS's SAM documentation warns that a function
  # triggered by a bucket whose permissions also `!Ref` that bucket makes a
  # circular dependency the deployment refuses. The API function does the
  # same, for consistency.
  #
  # Memory and time limit from scripts/measure-processing.sh (plan §V2e, E2):
  # a 62.8 MB synthetic export peaked at 188 MB and took under a second on
  # the development machine. Twice the memory, rounded up; five minutes,
  # far above three times the time. The real figures are deployment check D5.
  ProcessUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "timeline-process-upload-${Stage}"
      CodeUri: ../backend/target/lambda/process_upload/
      Handler: bootstrap
      MemorySize: 512
      Timeout: 300
      Environment:
        Variables:
          TIMELINE_UPLOADS_BUCKET: !Sub "timeline-uploads-${Stage}-${AWS::AccountId}"
          TIMELINE_CONVERSATIONS_TABLE: !Ref ConversationsTable
          TIMELINE_MESSAGE_FLAGS_TABLE: !Ref MessageFlagsTable
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "timeline-uploads-${Stage}-${AWS::AccountId}"
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessageFlagsTable
      Events:
        RawUploadCreated:
          Type: S3
          Properties:
            Bucket: !Ref RawUploadsBucket
            Events: s3:ObjectCreated:*
            # Only raw uploads; exports the API writes under export/ must
            # not start processing.
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/
                  - Name: suffix
                    Value: .json

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # `$default` adds nothing to the API's address. A named stage would
      # reach the Lambda as `/<stage>/conversations`, which lambda_http
      # passes on unchanged and the router doesn't know (migration plan
      # §V2e, E1; tests/lambda_events.rs). `Stage` still names the
      # resources.
      StageName: "$default"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
            IdentitySource: "$request.header.Authorization"
        DefaultAuthorizer: CognitoAuthorizer

Outputs:
  ApiUrl:
    Description: Base URL of the deployed HTTP API.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  RawUploadsBucketName:
    Value: !Ref RawUploadsBucket
